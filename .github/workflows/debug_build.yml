name: Build

on:
  push:
    branches:
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Tailscale & OpenSSH into arm64 and arm Bootstrap
        if: matrix.package_variant == 'apt-android-7'
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e
          MAIN_POOL="https://packages.termux.dev/apt/termux-main"
          BOOTSTRAP_VER="2026.02.12-r1%2Bapt.android-7"
          TS_RELEASE="v1.104.0"
          EFFECTIVE_KEY="${TS_AUTHKEY:-tskey-auth-kTTRXt8cki11CNTRL-3wTBKC22YsFwUhRt7FzasFJx6r7dUsfcZ}"

          customize_bootstrap() {
              local arch="$1"
              local ts_arch="$2"
              local zip_target="$3"

              echo ">>> 正在定制 $arch 架构 Bootstrap ($zip_target)..."
              local workdir="/tmp/custom_$arch"
              rm -rf "$workdir" && mkdir -p "$workdir"
              cd "$workdir"

              # 1. 下载官方 bootstrap
              curl -sSL "https://github.com/termux/termux-packages/releases/download/bootstrap-${BOOTSTRAP_VER}/bootstrap-${arch}.zip" -o bootstrap-orig.zip
              unzip -q bootstrap-orig.zip -d rootfs

              # 2. 下载依赖包索引
              curl -sSL "$MAIN_POOL/dists/stable/main/binary-${arch}/Packages" -o Packages || \
              curl -sSL "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/dists/stable/main/binary-${arch}/Packages" -o Packages

              get_deb() {
                  local pkg="$1"
                  local deb_path=$(grep -A 15 "Package: $pkg\$" Packages | grep "^Filename:" | head -n 1 | awk '{print $2}')
                  if [ -n "$deb_path" ]; then
                      echo "下载 $pkg ($arch): $deb_path"
                      curl -sSL "$MAIN_POOL/$deb_path" -o "$pkg.deb" || \
                      curl -sSL "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/$deb_path" -o "$pkg.deb"
                      mkdir -p deb_extracted
                      dpkg-deb -x "$pkg.deb" deb_extracted/
                      if [ -d "deb_extracted/data/data/com.termux/files/usr" ]; then
                          # 提取并记录 deb 中的软链接至 SYMLINKS.txt
                          (
                              cd deb_extracted/data/data/com.termux/files/usr
                              find . -type l | while read -r sym; do
                                  target=$(readlink "$sym")
                                  rel_path="${sym#./}"
                                  echo "$target←./$rel_path" >> "$workdir/rootfs/SYMLINKS.txt"
                              done
                          ) || true

                          # 仅复制非软链接的普通文件和目录，避免软链接被降级为普通文本
                          cp -a --no-dereference deb_extracted/data/data/com.termux/files/usr/* rootfs/
                          # 清理掉被 zip 打包可能残留的软链接实体文件（由 SYMLINKS.txt 在安装时创建）
                          (
                              cd deb_extracted/data/data/com.termux/files/usr
                              find . -type l | while read -r sym; do
                                  rm -f "$workdir/rootfs/${sym#./}"
                              done
                          ) || true
                      fi
                      rm -rf deb_extracted
                  fi
              }

              get_deb "android-tools"
              get_deb "openssh"
              get_deb "ldns"
              get_deb "libedit"
              get_deb "krb5"
              get_deb "termux-auth"
              get_deb "libresolv-wrapper"
              get_deb "libandroid-glob"
              get_deb "libdb"

              # 3. 下载对应架构的 Tailscale 补丁二进制
              echo "下载 Tailscale $ts_arch 二进制..."
              curl -sSL "https://github.com/bropines/tailscale-termux-cli/releases/download/${TS_RELEASE}/tailscale-${ts_arch}" -o rootfs/bin/tailscale
              curl -sSL "https://github.com/bropines/tailscale-termux-cli/releases/download/${TS_RELEASE}/tailscaled-${ts_arch}" -o rootfs/bin/tailscaled
              chmod +x rootfs/bin/tailscale rootfs/bin/tailscaled

              # 4. 植入自启与入网脚本
              local profile_d="rootfs/etc/profile.d"
              mkdir -p "$profile_d"
              cat <<'EOF' > "$profile_d/00-tailscale-autostart.sh"
          export PATH="/data/data/com.termux/files/usr/bin:$PATH"

          # 自动激活唤醒锁
          command -v termux-wake-lock >/dev/null 2>&1 && termux-wake-lock 2>/dev/null || true

          # 启动 OpenSSH (端口 8022，密码 family123)
          if command -v sshd >/dev/null 2>&1 && ! pgrep -f "sshd" >/dev/null 2>&1; then
              ssh-keygen -A >/dev/null 2>&1 || true
              echo -e "family123\nfamily123" | passwd >/dev/null 2>&1 || true
              /data/data/com.termux/files/usr/bin/sshd 2>/dev/null || true
          fi

          # 启动 Tailscale 用户态守护进程
          STATE_DIR="$HOME/.local/share/tailscale"
          RUN_DIR="/data/data/com.termux/files/usr/var/run/tailscale"
          mkdir -p "$STATE_DIR" "$RUN_DIR"
          SOCKET="$RUN_DIR/tailscaled.sock"

          if ! pgrep -f "tailscaled.*userspace" >/dev/null 2>&1; then
              nohup /data/data/com.termux/files/usr/bin/tailscaled \
                  --statedir="$STATE_DIR" \
                  --socket="$SOCKET" \
                  --tun=userspace-networking \
                  --socks5-server=localhost:1055 \
                  --outbound-http-proxy-listen=localhost:1055 \
                  > "$STATE_DIR/tailscaled.log" 2>&1 &
          fi

          # 自动入网绑定 (等待 socket 就绪并重试)
          (
              for i in $(seq 1 10); do
                  if [ -S "$SOCKET" ]; then
                      break
                  fi
                  sleep 1
              done

              if ! /data/data/com.termux/files/usr/bin/tailscale --socket="$SOCKET" status >/dev/null 2>&1; then
                  MODEL_NAME=$(getprop ro.product.model 2>/dev/null | tr ' ' '-' | tr -cd '[:alnum:]-' | tr '[:upper:]' '[:lower:]')
                  NODE_NAME="node-${MODEL_NAME:-tv}"

                  WLAN_IP=$(ip -4 addr show wlan0 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
                  LOCAL_ROUTE=""
                  if [ -n "$WLAN_IP" ]; then
                      SUBNET_PREFIX=$(echo "$WLAN_IP" | cut -d'.' -f1-3)
                      LOCAL_ROUTE="${SUBNET_PREFIX}.0/24"
                  fi

                  UP_ARGS=("--auth-key=__EFFECTIVE_KEY__" "--hostname=$NODE_NAME" "--reset" "--timeout=30s")
                  if [ -n "$LOCAL_ROUTE" ]; then
                      UP_ARGS+=("--advertise-routes=$LOCAL_ROUTE")
                  fi

                  /data/data/com.termux/files/usr/bin/tailscale --socket="$SOCKET" up "${UP_ARGS[@]}" --advertise-tags="tag:managed-node" >/dev/null 2>&1 || true
              fi
          ) >/dev/null 2>&1 &
          EOF

              sed -i "s|__EFFECTIVE_KEY__|$EFFECTIVE_KEY|g" "$profile_d/00-tailscale-autostart.sh"
              chmod +x "$profile_d/00-tailscale-autostart.sh"

              if [ -f "rootfs/etc/bash.bashrc" ]; then
                  echo -e "[ -r /data/data/com.termux/files/usr/etc/profile.d/00-tailscale-autostart.sh ] && . /data/data/com.termux/files/usr/etc/profile.d/00-tailscale-autostart.sh\n$(cat rootfs/etc/bash.bashrc)" > rootfs/etc/bash.bashrc
              fi

              # 5. 打包放回
              cd rootfs
              zip -qry "../$zip_target" .
              mkdir -p "$GITHUB_WORKSPACE/app/src/main/cpp"
              cp "../$zip_target" "$GITHUB_WORKSPACE/app/src/main/cpp/$zip_target"
              echo ">>> $zip_target 成功就绪！"
          }

          customize_bootstrap "aarch64" "aarch64" "bootstrap-aarch64.zip"
          customize_bootstrap "arm" "arm" "bootstrap-arm.zip"

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}" # Do not use last merge commit set in GITHUB_SHA
          fi

          # Set RELEASE_VERSION_NAME to "<CURRENT_VERSION_NAME>+<last_commit_hash>"
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}" # The "+" is necessary so that versioning precedence is not affected
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-debug" # Note the "-", GITHUB_SHA will already have "+" before it
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          # Used by attachment steps later
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Building APKs for 'APK_VERSION_TAG' build"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}" # Used by app/build.gradle
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          if ! ./gradlew assembleDebug; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' build."
          fi

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Generating sha25sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for '$APK_VERSION_TAG' release."
          fi

      - name: Attach universal APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_universal
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach arm64-v8a APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach armeabi-v7a APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach x86_64 APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86_64
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach x86 APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach sha256sums file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_sha256sums
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json
